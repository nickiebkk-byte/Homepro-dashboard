<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Plan 2027 — Training</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#005B54;--teal2:#007A6E;--tealLt:#E6F4F2;
  --navy:#0D2137;--gold:#F5A623;--goldLt:#FEF6E4;
  --red:#D94F4F;--green:#2E9E6B;--greenLt:#E8F7F0;
  --gray:#6B7B8D;--grayLt:#F4F6F8;--dark:#1A2B35;
  --border:#E2E8ED;--radius:14px;--shadow:0 8px 32px rgba(0,0,0,0.10);
}
html{scroll-behavior:smooth}
body{font-family:'Prompt',sans-serif;background:#F0F3F5;color:var(--dark);min-height:100vh}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ══════════════════════════════
   LOGIN SCREEN
══════════════════════════════ */
#screen-login{
  background:linear-gradient(160deg,var(--navy) 0%,#0a3d35 100%);
  align-items:center;justify-content:center;padding:32px 16px;
}
.login-stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0.08}50%{opacity:0.45}}

.login-card{
  position:relative;z-index:1;background:white;border-radius:20px;
  width:100%;max-width:420px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.3);
}
.login-top{
  background:linear-gradient(135deg,var(--navy),var(--teal2));
  padding:32px 28px 24px;text-align:center;
}
.login-top .lt-badge{
  display:inline-block;background:rgba(245,166,35,0.2);border:1px solid var(--gold);
  color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:14px;
}
.login-top h1{font-size:24px;font-weight:800;color:white;line-height:1.2;margin-bottom:6px}
.login-top p{font-size:12px;color:rgba(255,255,255,0.5)}
.login-body{padding:28px}
.login-label{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:10px;letter-spacing:0.5px;text-transform:uppercase}
.role-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.role-btn{
  width:100%;padding:13px 16px;border-radius:10px;
  border:1.5px solid var(--border);background:white;
  font-family:'Prompt',sans-serif;font-size:14px;font-weight:600;
  color:var(--dark);cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:12px;text-align:left;
}
.role-btn:hover{border-color:var(--teal);background:var(--tealLt);color:var(--teal)}
.role-btn.selected{border-color:var(--teal);background:var(--teal);color:white}
.role-btn.nick-btn:hover{border-color:var(--gold);background:var(--goldLt);color:#8B6000}
.role-btn.nick-btn.selected{border-color:var(--gold);background:var(--gold);color:var(--navy)}
.role-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(0,0,0,0.06)}
.role-btn.selected .role-icon{background:rgba(255,255,255,0.2)}
.role-sub{font-size:11px;font-weight:400;opacity:0.7;margin-top:1px}
.login-divider{height:1px;background:var(--border);margin:4px 0 16px}
.btn-enter{
  width:100%;padding:14px;border-radius:10px;border:none;
  background:var(--teal);color:white;font-family:'Prompt',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;
}
.btn-enter:hover{background:var(--teal2)}
.btn-enter:disabled{background:var(--border);color:var(--gray);cursor:not-allowed}
.btn-enter.gold{background:var(--gold);color:var(--navy)}
.btn-enter.gold:hover{background:#e09510}

/* ══════════════════════════════
   TEAM BOARD SCREEN
══════════════════════════════ */
#screen-board{background:#F0F3F5}
.topbar{
  background:var(--navy);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-brand .tb-dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.topbar-brand span{font-size:14px;font-weight:700;color:white}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:rgba(255,255,255,0.5)}
.topbar-user strong{color:var(--gold)}
.btn-sm{
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;border:none;font-family:'Prompt',sans-serif;transition:all 0.2s;
}
.btn-sm-teal{background:var(--teal);color:white}
.btn-sm-ghost{background:transparent;color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.2)}
.btn-sm-ghost:hover{border-color:var(--gold);color:var(--gold)}

.board-content{padding:24px;max-width:1100px;margin:0 auto}

/* LEADERBOARD */
.section-title{
  font-size:13px;font-weight:700;color:var(--gray);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.4)}}

/* PODIUM */
.leaderboard{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.lb-row{
  background:white;border-radius:12px;padding:14px 18px;
  display:flex;align-items:center;gap:14px;
  border:1.5px solid var(--border);transition:all 0.3s;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.lb-row.rank-1{border-color:#FFD700;background:linear-gradient(90deg,#FFFBEA,white)}
.lb-row.rank-2{border-color:#C0C0C0;background:linear-gradient(90deg,#F8F8F8,white)}
.lb-row.rank-3{border-color:#CD7F32;background:linear-gradient(90deg,#FFF5EE,white)}
.lb-row.me{border-color:var(--teal);background:var(--tealLt)}
.lb-rank{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;flex-shrink:0;
  background:var(--grayLt);color:var(--gray);
}
.lb-row.rank-1 .lb-rank{background:#FFD700;color:white;font-size:18px}
.lb-row.rank-2 .lb-rank{background:#A8A8A8;color:white;font-size:16px}
.lb-row.rank-3 .lb-rank{background:#CD7F32;color:white}
.lb-info{flex:1}
.lb-name{font-size:14px;font-weight:700;color:var(--dark)}
.lb-row.me .lb-name::after{content:' (คุณ)';color:var(--teal);font-size:12px}
.lb-div{font-size:11px;color:var(--gray);margin-top:1px}
.lb-step{font-size:12px;color:var(--gray)}
.lb-step strong{color:var(--teal)}
.lb-bar-wrap{width:160px;flex-shrink:0}
.lb-bar-bg{height:8px;background:var(--grayLt);border-radius:99px;overflow:hidden}
.lb-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width 0.8s ease}
.lb-row.rank-1 .lb-bar-fill{background:linear-gradient(90deg,#F5C000,#F5A623)}
.lb-pct{font-size:13px;font-weight:800;color:var(--teal);text-align:right;margin-top:4px}
.lb-row.rank-1 .lb-pct{color:#B87A00}
.me-badge{background:var(--teal);color:white;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px}

/* TEAM CARDS GRID */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:28px}
.team-card{
  background:white;border-radius:var(--radius);padding:18px;
  border:1.5px solid var(--border);transition:all 0.3s;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.team-card.me-card{border-color:var(--teal);background:var(--tealLt)}
.tc-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tc-avatar{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--grayLt);flex-shrink:0;
}
.me-card .tc-avatar{background:rgba(0,91,84,0.15)}
.tc-name{font-size:14px;font-weight:700;color:var(--dark)}
.tc-div{font-size:11px;color:var(--gray);margin-top:2px}
.tc-pct{font-size:20px;font-weight:800;color:var(--teal);margin-left:auto}
.me-card .tc-pct{color:var(--teal)}

/* Step pills */
.tc-steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.step-pill{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  background:var(--grayLt);color:var(--gray);border:1.5px solid var(--border);
  transition:all 0.3s;
}
.step-pill.done{background:var(--green);color:white;border-color:var(--green)}
.step-pill.current{background:var(--teal);color:white;border-color:var(--teal)}

.tc-prog-bg{height:6px;background:var(--grayLt);border-radius:99px;overflow:hidden}
.tc-prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width 0.8s ease}
.me-card .tc-prog-fill{background:linear-gradient(90deg,var(--teal),var(--gold))}

.tc-status{font-size:11px;color:var(--gray);margin-top:6px}
.tc-status strong{color:var(--dark)}

/* GO TO TRAINING BTN */
.btn-train{
  width:100%;margin-top:10px;padding:10px;border-radius:8px;border:none;
  background:var(--teal);color:white;font-family:'Prompt',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;
}
.btn-train:hover{background:var(--teal2)}

/* ══════════════════════════════
   TRAINING SCREEN
══════════════════════════════ */
#screen-training{background:#F0F3F5}
.train-topbar{
  background:white;border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
}
.train-topbar-left{display:flex;align-items:center;gap:10px}
.step-badge-sm{
  background:var(--tealLt);color:var(--teal);
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;
}
.train-topbar-title{font-size:14px;font-weight:600;color:var(--dark)}
.train-topbar-right{display:flex;gap:8px}

.btn-outline{
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border);background:white;
  color:var(--gray);font-family:'Prompt',sans-serif;transition:all 0.2s;
}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-primary{
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;
  cursor:pointer;border:none;background:var(--teal);color:white;
  font-family:'Prompt',sans-serif;transition:all 0.2s;
}
.btn-primary:hover{background:var(--teal2)}
.btn-primary:disabled{background:var(--border);color:var(--gray);cursor:not-allowed}

/* Progress bar */
.prog-wrap{background:white;border-bottom:1px solid var(--border);padding:10px 24px}
.prog-steps{display:flex;gap:4px}
.prog-step{
  flex:1;text-align:center;font-size:10px;font-weight:600;
  padding:6px 2px;border-radius:8px;color:rgba(0,0,0,0.3);
  transition:all 0.3s;cursor:pointer;
}
.prog-step.active{background:var(--teal);color:white}
.prog-step.done{background:var(--greenLt);color:var(--green)}
.prog-bar-wrap{margin-top:8px}
.prog-bar{height:3px;background:var(--grayLt);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px;transition:width 0.5s ease}

.train-content{padding:24px;max-width:820px;margin:0 auto}

/* STEP CARD */
.step-card{
  background:white;border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;display:none;animation:fadeUp 0.35s ease;
}
.step-card.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.step-header{
  padding:24px 28px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:16px;
}
.step-icon{
  width:52px;height:52px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;
}
.step-htext .eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:5px}
.step-htext h2{font-size:20px;font-weight:700;color:var(--dark);line-height:1.3;margin-bottom:5px}
.step-htext p{font-size:12px;color:var(--gray);line-height:1.6}
.step-time{background:var(--grayLt);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--gray);text-align:center;flex-shrink:0}
.step-time strong{display:block;font-size:16px;color:var(--dark);font-weight:700}

.step-body{padding:24px 28px}

.obj-box{background:var(--tealLt);border-left:4px solid var(--teal);border-radius:8px;padding:14px 18px;margin-bottom:20px}
.obj-label{font-size:10px;font-weight:700;color:var(--teal);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.obj-box p{font-size:12px;color:var(--dark);line-height:1.7}

.fw-row{display:flex;gap:0;margin-bottom:20px;border-radius:10px;overflow:hidden}
.fw-cell{flex:1;padding:14px 10px;text-align:center}
.fw-cell .fw-e{font-size:22px;margin-bottom:6px}
.fw-cell .fw-t{font-size:12px;font-weight:700;color:white;margin-bottom:3px}
.fw-cell .fw-d{font-size:10px;color:rgba(255,255,255,0.7);line-height:1.4}

.task-sec-title{font-size:12px;font-weight:700;color:var(--dark);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.task-list{list-style:none;margin-bottom:20px}
.task-item{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
  border-radius:10px;border:1.5px solid var(--border);margin-bottom:7px;
  cursor:pointer;transition:all 0.18s;background:white;
}
.task-item:hover{border-color:var(--teal);background:var(--tealLt)}
.task-item.checked{border-color:var(--green);background:var(--greenLt)}
.task-check{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:all 0.2s;font-size:11px;
}
.task-item.checked .task-check{background:var(--green);border-color:var(--green);color:white}
.task-item:hover .task-check{border-color:var(--teal)}
.task-content{flex:1}
.task-content strong{font-size:13px;font-weight:600;color:var(--dark)}
.task-item.checked .task-content strong{color:var(--green)}
.task-content p{font-size:11px;color:var(--gray);margin-top:2px;line-height:1.5}
.task-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;flex-shrink:0;margin-top:2px}

.tips-box{background:var(--goldLt);border-left:4px solid var(--gold);border-radius:8px;padding:14px 18px;margin-bottom:18px}
.tips-label{font-size:10px;font-weight:700;color:#B87A00;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.tips-box ul{padding-left:14px}
.tips-box ul li{font-size:12px;color:var(--dark);line-height:1.7;margin-bottom:3px}

.del-box{background:var(--navy);border-radius:10px;padding:16px 18px;display:flex;align-items:flex-start;gap:12px}
.del-icon{font-size:24px;flex-shrink:0}
.del-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.del-box p{font-size:12px;color:rgba(255,255,255,0.8);line-height:1.6}

.step-foot{
  padding:14px 28px;background:var(--grayLt);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.tasks-done-lbl{font-size:12px;color:var(--gray)}
.tasks-done-lbl strong{color:var(--green)}

/* complete banner */
.complete-banner{
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  border-radius:12px;padding:20px 22px;
  display:none;align-items:center;gap:16px;margin-bottom:20px;
}
.complete-banner.show{display:flex}
.complete-banner h3{font-size:16px;font-weight:700;color:white}
.complete-banner p{font-size:12px;color:rgba(255,255,255,0.8);margin-top:3px}

/* Nick board extras */
.nick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:white;border-radius:12px;padding:16px;border:1.5px solid var(--border);text-align:center}
.stat-val{font-size:28px;font-weight:800;color:var(--teal)}
.stat-label{font-size:11px;color:var(--gray);margin-top:3px}

/* saving indicator */
.save-indicator{
  position:fixed;bottom:20px;right:20px;
  background:var(--green);color:white;
  font-size:12px;font-weight:700;padding:8px 16px;border-radius:99px;
  display:none;z-index:999;animation:fadeUp 0.3s ease;
}
.save-indicator.show{display:block}

</style>
</head>
<body>

<!-- ══════════════════════════════
     SCREEN 1: LOGIN
══════════════════════════════ -->
<div class="screen active" id="screen-login">
  <div class="login-stars" id="stars"></div>
  <div class="login-card">
    <div class="login-top">
      <div class="lt-badge">Business Plan 2027</div>
      <h1>Training<br>Workshop</h1>
      <p>HomePro & MegaHome · เลือกตำแหน่งของคุณ</p>
    </div>
    <div class="login-body">
      <div class="login-label">AVP Leaders</div>
      <div class="role-grid" id="role-grid-avp">
        <button class="role-btn" onclick="selectRole(this,'avp_sa','📊','AVP SA')">
          <div class="role-icon">📊</div>
          <div><div>AVP SA</div><div class="role-sub">Smart & Appliance</div></div>
        </button>
        <button class="role-btn" onclick="selectRole(this,'avp_kc','🍳','AVP KC')">
          <div class="role-icon">🍳</div>
          <div><div>AVP KC</div><div class="role-sub">Kitchen & Cabinet</div></div>
        </button>
        <button class="role-btn" onclick="selectRole(this,'avp_ho1','🏠','AVP HO1')">
          <div class="role-icon">🏠</div>
          <div><div>AVP HO1</div><div class="role-sub">Home 1</div></div>
        </button>
        <button class="role-btn" onclick="selectRole(this,'avp_ho2','🛋️','AVP HO2')">
          <div class="role-icon">🛋️</div>
          <div><div>AVP HO2</div><div class="role-sub">Home 2</div></div>
        </button>
      </div>
      <div class="login-label" style="margin-top:14px">Promotion Team</div>
      <div class="role-grid">
        <button class="role-btn" onclick="selectRole(this,'avp_pro_sa','🎯','AVP PRO SA')">
          <div class="role-icon">🎯</div>
          <div><div>AVP PRO SA</div><div class="role-sub">Promotion SA</div></div>
        </button>
        <button class="role-btn" onclick="selectRole(this,'avp_pro_kcho','📣','AVP PRO KC HO')">
          <div class="role-icon">📣</div>
          <div><div>AVP PRO KC HO</div><div class="role-sub">Promotion KC & HO</div></div>
        </button>
      </div>
      <div class="login-divider"></div>
      <div class="role-grid">
        <button class="role-btn nick-btn" onclick="selectRole(this,'nick','👑','Nick — Executive')">
          <div class="role-icon">👑</div>
          <div><div>Nick</div><div class="role-sub">Executive Dashboard</div></div>
        </button>
      </div>
      <button class="btn-enter" id="btn-enter" disabled onclick="enterApp()">เข้าสู่ระบบ →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN 2: TEAM BOARD
══════════════════════════════ -->
<div class="screen" id="screen-board">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="tb-dot"></div>
      <span>Business Plan 2027 — Team Board</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-user">เข้าใช้งานเป็น: <strong id="tb-username">—</strong></span>
      <button class="btn-sm btn-sm-ghost" onclick="goTraining()" id="btn-go-train" style="display:none">📚 ไปทำ Training →</button>
      <button class="btn-sm btn-sm-ghost" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="board-content">

    <!-- Nick Stats (only visible to Nick) -->

// ── FIREBASE HELPERS ──
async function saveProgress(userId, stepIdx, taskId, checked) {
  if (!db) { lsSave(userId, stepIdx, taskId, checked); return; }
  try {
    const ref = window._fbMod.doc(db, 'training_progress', userId);
    const snap = await window._fbMod.getDoc(ref);
    const data = snap.exists() ? snap.data() : { steps: {} };
    if (!data.steps) data.steps = {};
    if (!data.steps[stepIdx]) data.steps[stepIdx] = [];
    const arr = data.steps[stepIdx];
    if (checked && !arr.includes(taskId)) arr.push(taskId);
    if (!checked) { const i = arr.indexOf(taskId); if(i>-1) arr.splice(i,1); }
    data.steps[stepIdx] = arr;
    data.lastUpdated = new Date().toISOString();
    data.role = userId;
    await window._fbMod.setDoc(ref, data, { merge: true });
    showSaved();
  } catch(e) { lsSave(userId, stepIdx, taskId, checked); }
}

async function loadProgress(userId) {
  if (!db) return lsLoad(userId);
  try {
    const ref = window._fbMod.doc(db, 'training_progress', userId);
    const snap = await window._fbMod.getDoc(ref);
    if (!snap.exists()) return {};
    const raw = snap.data().steps || {};
    const result = {};
    Object.keys(raw).forEach(k => { result[parseInt(k)] = new Set(raw[k]); });
    return result;
  } catch(e) { return lsLoad(userId); }
}

async function loadAllProgress() {
  if (!db) return lsLoadAll();
  try {
    const snap = await window._fbMod.getDocs(window._fbMod.collection(db, 'training_progress'));
    const result = {};
    snap.forEach(d => {
      const raw = d.data().steps || {};
      const steps = {};
      Object.keys(raw).forEach(k => { steps[parseInt(k)] = new Set(raw[k]); });
      result[d.id] = steps;
    });
    return result;
  } catch(e) { return lsLoadAll(); }
}

function subscribeAll(callback) {
  if (!db) { callback(lsLoadAll()); return () => {}; }
  try {
    return window._fbMod.onSnapshot(
      window._fbMod.collection(db, 'training_progress'),
      snap => {
        const result = {};
        snap.forEach(d => {
          const raw = d.data().steps || {};
          const steps = {};
          Object.keys(raw).forEach(k => { steps[parseInt(k)] = new Set(raw[k]); });
          result[d.id] = steps;
        });
        callback(result);
      }
    );
  } catch(e) { callback(lsLoadAll()); return () => {}; }
}

window._saveProgress = saveProgress;
window._loadProgress = loadProgress;
window._loadAllProgress = loadAllProgress;
window._subscribeAll = subscribeAll;

// localStorage fallback
function lsSave(uid, stepIdx, taskId, checked) {
  const all = JSON.parse(localStorage.getItem('training_v2') || '{}');
  if (!all[uid]) all[uid] = {};
  if (!all[uid][stepIdx]) all[uid][stepIdx] = [];
  const arr = all[uid][stepIdx];
  if (checked && !arr.includes(taskId)) arr.push(taskId);
  if (!checked) { const i = arr.indexOf(taskId); if(i>-1) arr.splice(i,1); }
  all[uid][stepIdx] = arr;
  localStorage.setItem('training_v2', JSON.stringify(all));
  showSaved();
}
function lsLoad(uid) {
  const all = JSON.parse(localStorage.getItem('training_v2') || '{}');
  const raw = all[uid] || {};
  const result = {};
  Object.keys(raw).forEach(k => { result[parseInt(k)] = new Set(raw[k]); });
  return result;
}
function lsLoadAll() {
  const all = JSON.parse(localStorage.getItem('training_v2') || '{}');
  const result = {};
  Object.keys(all).forEach(uid => {
    const raw = all[uid];
    const steps = {};
    Object.keys(raw).forEach(k => { steps[parseInt(k)] = new Set(raw[k]); });
    result[uid] = steps;
  });
  return result;
}

function showSaved() {
  const el = document.getElementById('save-indicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
</script>

<script>
// ══════════════════════════════
// APP STATE
// ══════════════════════════════
let currentUser = null;
let currentStepIdx = 0;
let userProgress = {}; // { stepIdx: Set([taskIds]) }
let allProgress = {};  // { userId: { stepIdx: Set } }
let unsubscribe = null;

// ══════════════════════════════
// LOGIN
// ══════════════════════════════
function selectRole(btn, id, icon, label) {
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const enterBtn = document.getElementById('btn-enter');
  enterBtn.disabled = false;
  enterBtn.textContent = `เข้าสู่ระบบ — ${label} →`;
  if (id === 'nick') {
    enterBtn.className = 'btn-enter gold';
  } else {
    enterBtn.className = 'btn-enter';
  }
  window._selectedRole = { id, icon, label };
}

async function enterApp() {
  if (!window._selectedRole) return;
  currentUser = window._selectedRole;

  // Load progress
  if (currentUser.id !== 'nick') {
    // Wait for Firebase module
    await waitForFirebase();
    userProgress = await window._loadProgress(currentUser.id);
  }

  showBoard();
}

async function waitForFirebase() {
  let tries = 0;
  while (!window._loadProgress && tries < 20) {
    await new Promise(r => setTimeout(r, 200));
    tries++;
  }
}

function logout() {
  if (unsubscribe) unsubscribe();
  currentUser = null;
  userProgress = {};
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-enter').disabled = true;
  document.getElementById('btn-enter').textContent = 'เข้าสู่ระบบ →';
  showScreen('screen-login');
}

// ══════════════════════════════
// STARS
// ══════════════════════════════
(function() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 0.8;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    c.appendChild(s);
  }
})();

// ══════════════════════════════
// SCREENS
// ══════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ══════════════════════════════
// BOARD
// ══════════════════════════════
function showBoard() {
  showScreen('screen-board');
  document.getElementById('tb-username').textContent = currentUser.label;

  // Show/hide train button
  const btnTrain = document.getElementById('btn-go-train');
  btnTrain.style.display = currentUser.id !== 'nick' ? 'block' : 'none';

  // Nick stats
  document.getElementById('nick-stats-wrap').style.display =
    currentUser.id === 'nick' ? 'block' : 'none';

  // Subscribe to realtime updates
  if (unsubscribe) unsubscribe();
  if (window._subscribeAll) {
    unsubscribe = window._subscribeAll(data => {
      allProgress = data;
      renderBoard();
    });
  } else {
    setTimeout(async () => {
      if (window._loadAllProgress) {
        allProgress = await window._loadAllProgress();
      }
      renderBoard();
    }, 800);
  }
}

function calcPct(prog) {
  if (!prog) return 0;
  const totalTasks = window.STEPS.reduce((s, st) => s + st.tasks.length, 0);
  let done = 0;
  Object.values(prog).forEach(s => { done += s.size; });
  return Math.round(done / totalTasks * 100);
}

function calcCurrentStep(prog) {
  if (!prog) return 0;
  for (let i = 0; i < window.STEPS.length; i++) {
    const s = window.STEPS[i];
    const done = prog[i] ? prog[i].size : 0;
    if (done < s.tasks.length) return i;
  }
  return window.STEPS.length - 1;
}

function renderBoard() {
  const team = window.TEAM;

  // Build sorted list
  const ranked = team.map(m => {
    const prog = allProgress[m.id] || {};
    const pct = calcPct(prog);
    const stepIdx = calcCurrentStep(prog);
    let totalDone = 0;
    Object.values(prog).forEach(s => { totalDone += s.size; });
    return { ...m, pct, stepIdx, prog, totalDone };
  }).sort((a, b) => b.pct - a.pct);

  // LEADERBOARD
  const lb = document.getElementById('leaderboard');
  const medals = ['🥇', '🥈', '🥉'];
  lb.innerHTML = ranked.map((m, i) => {
    const isMe = currentUser && m.id === currentUser.id;
    const rankClass = i < 3 ? `rank-${i+1}` : '';
    return `
      <div class="lb-row ${rankClass} ${isMe ? 'me' : ''}">
        <div class="lb-rank">${i < 3 ? medals[i] : i+1}</div>
        <div class="lb-info">
          <div class="lb-name">${m.icon} ${m.label}${isMe ? '' : ''}</div>
          <div class="lb-div">${m.div}</div>
        </div>
        <div class="lb-step">Step <strong>${m.stepIdx + 1}</strong>/8 · ${m.totalDone} tasks</div>
        <div class="lb-bar-wrap">
          <div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${m.pct}%"></div></div>
          <div class="lb-pct">${m.pct}%</div>
        </div>
      </div>
    `;
  }).join('');

  // TEAM GRID
  const grid = document.getElementById('team-grid');
  grid.innerHTML = ranked.map(m => {
    const isMe = currentUser && m.id === currentUser.id;
    const stepPills = window.STEPS.map((st, i) => {
      const done = m.prog[i] ? m.prog[i].size === st.tasks.length : false;
      const isCur = i === m.stepIdx && !done;
      return `<div class="step-pill ${done ? 'done' : ''} ${isCur ? 'current' : ''}">${done ? '✓' : i+1}</div>`;
    }).join('');
    return `
      <div class="team-card ${isMe ? 'me-card' : ''}">
        <div class="tc-head">
          <div class="tc-avatar">${m.icon}</div>
          <div>
            <div class="tc-name">${m.label}${isMe ? '<span class="me-badge">คุณ</span>' : ''}</div>
            <div class="tc-div">${m.div}</div>
          </div>
          <div class="tc-pct">${m.pct}%</div>
        </div>
        <div class="tc-steps">${stepPills}</div>
        <div class="tc-prog-bg"><div class="tc-prog-fill" style="width:${m.pct}%"></div></div>
        <div class="tc-status">กำลังทำ: <strong>${window.STEPS[m.stepIdx].title}</strong></div>
        ${isMe ? '<button class="btn-train" onclick="goTraining()">📚 ไปทำ Training →</button>' : ''}
      </div>
    `;
  }).join('');

  // Nick stats
  if (currentUser && currentUser.id === 'nick') {
    const allPcts = ranked.map(m => m.pct);
    const avg = Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length);
    const done = ranked.filter(m => m.pct === 100).length;
    const totalTasks = ranked.reduce((a,m)=>a+m.totalDone,0);
    document.getElementById('ns-avg').textContent = avg + '%';
    document.getElementById('ns-done').textContent = done;
    document.getElementById('ns-tasks').textContent = totalTasks;
  }
}

// ══════════════════════════════
// TRAINING
// ══════════════════════════════
function goTraining() {
  if (!currentUser || currentUser.id === 'nick') return;
  // Start from where they left off
  const stepIdx = calcCurrentStep(userProgress);
  currentStepIdx = stepIdx;
  showScreen('screen-training');
  renderTrainingStep();
}

function renderTrainingStep() {
  const s = window.STEPS[currentStepIdx];
  const done = userProgress[currentStepIdx] ? userProgress[currentStepIdx].size : 0;
  const total = s.tasks.length;
  const allDone = done === total;

  // Topbar
  document.getElementById('train-badge').textContent = `STEP ${s.id}/8`;
  document.getElementById('train-title').textContent = s.title;
  document.getElementById('t-prev').disabled = currentStepIdx === 0;

  // Prog steps
  const progSteps = document.getElementById('t-prog-steps');
  progSteps.innerHTML = window.STEPS.map((st, i) => {
    const isDone = userProgress[i] && userProgress[i].size === st.tasks.length;
    return `<div class="prog-step ${i===currentStepIdx?'active':''} ${isDone?'done':''}" onclick="jumpStep(${i})">${isDone?'✓':st.id}</div>`;
  }).join('');
  document.getElementById('t-prog-fill').style.width =
    (((currentStepIdx) / window.STEPS.length) * 100) + '%';

  // Step card
  const fwBg = s.fwBg || '#005B54';
  const content = document.getElementById('train-content');
  content.innerHTML = `
    <div class="step-card active">
      <div class="step-header">
        <div class="step-icon" style="background:${s.iconBg}">${s.icon}</div>
        <div class="step-htext">
          <div class="eyebrow">${s.phase} · STEP ${s.id} OF 8</div>
          <h2>${s.title}</h2>
          <p>${s.desc}</p>
        </div>
        <div class="step-time"><strong>${s.time}</strong>เวลาที่ใช้</div>
      </div>

      <div class="step-body">
        <div class="obj-box">
          <div class="obj-label">🎯 วัตถุประสงค์</div>
          <p>${s.objective}</p>
        </div>

        <div class="fw-row" style="background:${fwBg}">
          ${s.fw.map(f=>`<div class="fw-cell"><div class="fw-e">${f.e}</div><div class="fw-t">${f.t}</div><div class="fw-d">${f.d}</div></div>`).join('')}
        </div>

        <div class="complete-banner ${allDone?'show':''}">
          <div style="font-size:32px">🎉</div>
          <div><h3>ทำ Step นี้ครบแล้ว!</h3><p>Tasks ครบ ${total}/${total} — พร้อมไปขั้นต่อไปได้เลย</p></div>
        </div>

        <div class="task-sec-title">✅ สิ่งที่ต้องทำ (${done}/${total})</div>
        <ul class="task-list">
          ${s.tasks.map(t => {
            const chk = userProgress[currentStepIdx] && userProgress[currentStepIdx].has(t.id);
            return `
              <li class="task-item ${chk?'checked':''}" onclick="toggleTask('${t.id}')">
                <div class="task-check">${chk?'✓':''}</div>
                <div class="task-content">
                  <strong>${t.title}</strong>
                  <p>${t.desc}</p>
                </div>
                <span class="task-tag" style="background:${t.tagBg};color:${t.tagColor}">${t.tag}</span>
              </li>`;
          }).join('')}
        </ul>

        <div class="tips-box">
          <div class="tips-label">💡 Tips</div>
          <ul>${s.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
        </div>

        <div class="del-box">
          <div class="del-icon">📦</div>
          <div>
            <div class="del-label">Deliverable</div>
            <p>${s.del}</p>
          </div>
        </div>
      </div>

      <div class="step-foot">
        <div class="tasks-done-lbl">Tasks: <strong>${done}/${total}</strong>${allDone?' 🎉':''}</div>
        <div style="display:flex;gap:8px">
          <button class="btn-outline" onclick="navigateStep(-1)" ${currentStepIdx===0?'disabled':''}>← ก่อนหน้า</button>
          <button class="btn-primary" onclick="navigateStep(1)" ${currentStepIdx===window.STEPS.length-1?'style="background:var(--green)"':''}>
            ${currentStepIdx===window.STEPS.length-1?'🎉 เสร็จสมบูรณ์':'ถัดไป →'}
          </button>
        </div>
      </div>
    </div>
  `;
}

async function toggleTask(taskId) {
  if (!userProgress[currentStepIdx]) userProgress[currentStepIdx] = new Set();
  const checked = !userProgress[currentStepIdx].has(taskId);
  if (checked) userProgress[currentStepIdx].add(taskId);
  else userProgress[currentStepIdx].delete(taskId);

  renderTrainingStep();

  // Save to Firebase
  if (window._saveProgress) {
    await window._saveProgress(currentUser.id, currentStepIdx, taskId, checked);
  }
}

function navigateStep(dir) {
  const next = currentStepIdx + dir;
  if (next >= 0 && next < window.STEPS.length) {
    currentStepIdx = next;
    renderTrainingStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function jumpStep(idx) {
  currentStepIdx = idx;
  renderTrainingStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showBoard() {
  // re-sync user progress before showing board
  if (currentUser && currentUser.id !== 'nick' && window._loadProgress) {
    window._loadProgress(currentUser.id).then(p => {
      userProgress = p;
    });
  }
  showScreen('screen-board');
  document.getElementById('tb-username').textContent = currentUser ? currentUser.label : '—';
  const btnTrain = document.getElementById('btn-go-train');
  btnTrain.style.display = currentUser && currentUser.id !== 'nick' ? 'block' : 'none';
  document.getElementById('nick-stats-wrap').style.display =
    currentUser && currentUser.id === 'nick' ? 'block' : 'none';

  if (unsubscribe) unsubscribe();
  if (window._subscribeAll) {
    unsubscribe = window._subscribeAll(data => {
      allProgress = data;
      renderBoard();
    });
  } else {
    setTimeout(async () => {
      if (window._loadAllProgress) allProgress = await window._loadAllProgress();
      renderBoard();
    }, 600);
  }
}
</script>
</body>
