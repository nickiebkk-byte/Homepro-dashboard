<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;background:#f0efec;padding:16px;color:#2c2c2a}
.input-area{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:14px;margin-bottom:14px}
.lbl{font-size:13px;font-weight:600;margin-bottom:6px}
.sub{font-size:11px;color:#888780;margin-bottom:8px}
textarea{width:100%;height:90px;font-size:11px;font-family:'Prompt',sans-serif;border:0.5px solid #d3d1c7;border-radius:6px;padding:8px;background:#fafafa;resize:vertical}

/* Template selector */
.tpl-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tpl-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border:2px solid #d3d1c7;border-radius:8px;
  cursor:pointer;background:#fff;font-family:'Prompt',sans-serif;font-size:12px;font-weight:500;
  transition:border-color .15s,background .15s;
}
.tpl-btn:hover{background:#f9f9f8}
.tpl-btn.active{border-color:#444441;background:#f9f9f8}
.tpl-swatch{display:flex;gap:3px}
.tpl-sq{width:12px;height:12px;border-radius:3px;display:inline-block}

.btn-r{padding:7px 18px;background:#e34948;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Prompt',sans-serif}
.btn-r:hover{background:#c43b3a}
.btn-d{padding:7px 14px;border:0.5px solid #888780;border-radius:6px;font-size:13px;cursor:pointer;background:#fff;font-family:'Prompt',sans-serif}
.btn-exp{padding:7px 14px;border:0.5px solid #444441;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:#444441;color:#fff;font-family:'Prompt',sans-serif}
.btn-exp:hover{background:#2c2c2a}
.btn-exp:disabled{opacity:.5;cursor:not-allowed}
.err{color:#e34948;font-size:12px}

/* 16:9 dashboard */
#dash{
  display:none;width:100%;aspect-ratio:16/9;background:#fff;
  border:0.5px solid #d3d1c7;border-radius:12px;
  padding:14px 16px 12px;flex-direction:column;gap:6px;overflow:hidden;
}
.sec{display:flex;flex-direction:column;flex:1;min-height:0}
.sl{font-size:9px;font-weight:700;color:#888780;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.gGrid{display:grid;gap:6px;flex:1;min-height:0}
.card{background:#fff;border:0.5px solid #d3d1c7;border-radius:8px;padding:5px 7px 5px;display:flex;flex-direction:column;min-height:0;}
.card.total{background:#e8e7e3;border-color:#b4b2a9}
.ach{font-size:18px;font-weight:700;color:#f5a623;line-height:1.2;margin-bottom:1px}
.leg{display:flex;gap:5px;margin-bottom:2px;flex-wrap:wrap}
.leg span{font-size:8px;color:#888780;display:flex;align-items:center;gap:2px}
.sq{width:7px;height:7px;border-radius:2px;display:inline-block}
.chart-wrap{position:relative;flex:1;min-height:0}
.card-footer{display:flex;align-items:flex-end;justify-content:space-between;margin-top:3px}
.mcl{font-weight:700;color:#2c2c2a;line-height:1}
.gtr{font-size:11.5px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.2}
.mf{color:#888780}
.dash-heading{
  width:100%;border:none;outline:none;background:transparent;
  font-family:'Prompt',sans-serif;font-size:18px;font-weight:700;
  line-height:1.2;padding:0;margin-bottom:4px;
  white-space:normal;word-break:break-word;
}
</style>
</head>
<body>

<div class="input-area">
  <p class="lbl">เลือก Template สี</p>
  <div class="tpl-row" id="tplRow">
    <button class="tpl-btn active" data-tpl="megahome" onclick="setTpl(this)">
      <div class="tpl-swatch">
        <span class="tpl-sq" style="background:#888780"></span>
        <span class="tpl-sq" style="background:#444441"></span>
        <span class="tpl-sq" style="background:#e34948"></span>
      </div>
      MEGAHOME
    </button>
    <button class="tpl-btn" data-tpl="homepro" onclick="setTpl(this)">
      <div class="tpl-swatch">
        <span class="tpl-sq" style="background:#4a9ede"></span>
        <span class="tpl-sq" style="background:#2d5fa8"></span>
        <span class="tpl-sq" style="background:#f5a623"></span>
      </div>
      HOMEPRO
    </button>
  </div>

  <p class="lbl">วางข้อมูลจาก Excel</p>
  <p class="sub">3 ตารางเรียงกัน: SALES | GP% | GPA คั่นด้วย column ว่าง</p>
  <textarea id="raw" placeholder="MC&#9;2025&#9;TARGET&#9;2026&#9;%ACH&#9;GTH&#9;LFL&#9;&#9;MC&#9;..."></textarea>
  <div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap">
    <button class="btn-r" onclick="run()">แสดงกราฟ</button>
    <button class="btn-d" onclick="loadDemo()">ใช้ข้อมูล Demo</button>
    <span style="flex:1"></span>
    <button class="btn-exp" id="bImg" onclick="exportImg()" style="display:none">⬇ PNG</button>
    <button class="btn-exp" id="bPdf" onclick="exportPdf()" style="display:none">⬇ PDF</button>
    <button class="btn-exp" id="bPpt" onclick="exportPpt()" style="display:none">⬇ PowerPoint</button>
    <span id="err" class="err"></span>
  </div>
</div>

<div id="dash">
  <input class="dash-heading" id="dashHeading" type="text" value="Sales Performance Dashboard" placeholder="พิมพ์ชื่อ Dashboard..." />
  <div class="sec"><p class="sl">SALES (ล้านบาท)</p><div class="gGrid" id="sS"></div></div>
  <div class="sec"><p class="sl">GP% (อัตรากำไรขั้นต้น)</p><div class="gGrid" id="gS"></div></div>
  <div class="sec"><p class="sl">GPA (กำไรขั้นต้น ล้านบาท)</p><div class="gGrid" id="aS"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
// ---- Templates ----
const TEMPLATES={
  megahome:{
    y2025:'#888780', target:'#444441', y2026:'#e34948',
    achColor:'#f5a623', totalBg:'#e8e7e3', totalBorder:'#b4b2a9',
    label:['2025','TARGET','2026']
  },
  homepro:{
    y2025:'#4a9ede', target:'#2d5fa8', y2026:'#f5a623',
    achColor:'#e34948', totalBg:'#ddeaf7', totalBorder:'#9bbfe0',
    label:['2025','TARGET','2026']
  }
};
let curTpl='megahome';
let lastData=null;

function setTpl(btn){
  document.querySelectorAll('.tpl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curTpl=btn.dataset.tpl;
  if(lastData)renderAll(lastData);
  else updateHeadingColor();
}

function tpl(){return TEMPLATES[curTpl];}

// ---- Parse ----
let CHS={};
function dn(v){if(v==null||String(v).trim()==='')return null;return parseFloat(String(v).replace('%','').replace(',','').trim());}

function parse(raw){
  const lines=raw.trim().split('\n').map(l=>l.split('\t').map(s=>s.trim()));
  if(lines.length<2)return null;
  const hdr=lines[0];const gaps=[];
  hdr.forEach((h,i)=>{if(h===''||h==null)gaps.push(i);});
  let b1=0,b2=-1,b3=-1;
  for(const g of gaps){if(b2<0&&g>2){b2=g+1;}else if(b2>0&&b3<0&&g>b2){b3=g+1;break;}}
  if(b2<0)return null;
  const rows={};
  lines.slice(1).forEach(r=>{
    const mc=r[b1];if(!mc||mc==='')return;
    const key=mc.toUpperCase();
    if(!rows[key])rows[key]={mc,sales:null,gp:null,gpa:null,gth_s:null,lfl_s:null,gth_gp:null,gth_gpa:null};
    const s25=dn(r[b1+1]),st=dn(r[b1+2]),s26=dn(r[b1+3]),gths=dn(r[b1+5]),lfls=dn(r[b1+6]);
    if(s25!=null)rows[key].sales=[s25,st,s26];
    if(gths!=null)rows[key].gth_s=gths;if(lfls!=null)rows[key].lfl_s=lfls;
    if(b2>0&&r[b2]){const g25=dn(r[b2+1]),gt=dn(r[b2+2]),g26=dn(r[b2+3]),gthgp=dn(r[b2+5]);
      if(g25!=null)rows[key].gp=[g25,gt,g26];if(gthgp!=null)rows[key].gth_gp=gthgp;}
    if(b3>0&&r[b3]){const a25=dn(r[b3+1]),at=dn(r[b3+2]),a26=dn(r[b3+3]),gthgpa=dn(r[b3+5]);
      if(a25!=null)rows[key].gpa=[a25,at,a26];if(gthgpa!=null)rows[key].gth_gpa=gthgpa;}
  });
  const arr=Object.values(rows).filter(r=>r.sales);
  const ti=arr.findIndex(r=>r.mc.toUpperCase()==='TOTAL');
  if(ti>0){const[t]=arr.splice(ti,1);arr.unshift(t);}
  return arr.length?arr:null;
}

function ach(a,b){return b?Math.round(a/b*100):0;}
function gColor(v){return v==null?'#888780':v>=0?'#1baf7a':'#e34948';}
function gLabel(v){if(v==null)return '—';return (v>=0?'+':'')+v.toFixed(1)+'%';}
function killAll(){Object.values(CHS).forEach(c=>c.destroy());CHS={};}

function gridLayout(n){
  const mcSize=n<=4?'20px':n<=6?'16px':n<=8?'13px':'11px';
  return{cols:n,mcSize};
}
function applyGrid(n){
  const{cols,mcSize}=gridLayout(n);
  document.querySelectorAll('.gGrid').forEach(g=>{
    g.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
    g.style.width='100%';
  });
  return mcSize;
}

function makeCard(container,d,vals,achVal,gthVal,lflVal,hasLfl,isPct,mcSize){
  if(!vals)return;
  const T=tpl();
  const isTotal=d.mc.toUpperCase()==='TOTAL';
  const bgColor=isTotal?T.totalBg:null;
  const fmtVal=v=>v==null?'—':isPct?v.toFixed(1)+'%':v.toFixed(1);
  const yTickFmt=isPct?v=>v.toFixed(1)+'%':v=>v.toFixed(1);
  const BAR=[T.y2025,T.target,T.y2026];

  let gtrHtml=`<span><span class="mf">%GTH</span> <span style="color:${gColor(gthVal)};font-weight:600">${gLabel(gthVal)}</span></span>`;
  if(hasLfl&&lflVal!=null)gtrHtml+=`<span><span class="mf">LFL</span> <span style="color:${gColor(lflVal)};font-weight:600">${gLabel(lflVal)}</span></span>`;

  const card=document.createElement('div');
  card.className='card'+(isTotal?' total':'');
  if(isTotal){card.style.background=T.totalBg;card.style.borderColor=T.totalBorder;}
  const cid='cv_'+Math.random().toString(36).slice(2,9);
  card.innerHTML=`
    <div class="ach" style="color:${T.achColor}">• ${achVal}%</div>
    <div class="leg">
      <span><span class="sq" style="background:${T.y2025}"></span>2025</span>
      <span><span class="sq" style="background:${T.target}"></span>TARGET</span>
      <span><span class="sq" style="background:${T.y2026}"></span>2026</span>
    </div>
    <div class="chart-wrap"><canvas id="${cid}" role="img" aria-label="${d.mc}">${vals.map(fmtVal).join(', ')}</canvas></div>
    <div class="card-footer">
      <div class="mcl" style="font-size:${mcSize}">${d.mc}</div>
      <div class="gtr">${gtrHtml}</div>
    </div>`;
  document.getElementById(container).appendChild(card);

  const ch=new Chart(document.getElementById(cid),{
    type:'bar',
    data:{labels:['2025','TARGET','2026'],datasets:[{data:vals,backgroundColor:BAR,borderRadius:{topLeft:3,topRight:3},borderSkipped:'bottom',barPercentage:0.95,categoryPercentage:0.85}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtVal(c.raw)}}},
      scales:{
        x:{grid:{display:false},border:{display:false},ticks:{font:{size:7,family:"'Prompt',sans-serif"},color:'#888780',maxRotation:0,minRotation:0}},
        y:{grid:{color:'rgba(136,135,128,0.12)',lineWidth:0.5},border:{display:false},ticks:{font:{size:8,family:"'Prompt',sans-serif"},color:'#888780',callback:yTickFmt},min:0,grace:'15%'}
      },
      animation:{duration:350}
    }
  });
  CHS[cid]=ch;

  Chart.register({
    id:'dl_'+cid,
    beforeDraw(chart){
      if(chart.canvas.id!==cid||!bgColor)return;
      const{ctx:cx,width:w,height:h}=chart;
      cx.save();cx.fillStyle=bgColor;cx.fillRect(0,0,w,h);cx.restore();
    },
    afterDatasetDraw(chart){
      if(chart.canvas.id!==cid)return;
      const{ctx:cx}=chart;
      chart.data.datasets[0].data.forEach((val,i)=>{
        const b=chart.getDatasetMeta(0).data[i];if(!b)return;
        cx.save();cx.font="700 15px 'Prompt',sans-serif";cx.fillStyle='#444441';cx.textAlign='center';
        cx.fillText(fmtVal(val),b.x,b.y-3);cx.restore();
      });
    }
  });
}

function renderAll(data){
  killAll();
  ['sS','gS','aS'].forEach(id=>document.getElementById(id).innerHTML='');
  const n=data.length;const mcSize=applyGrid(n);
  data.forEach(d=>{
    makeCard('sS',d,d.sales,ach(d.sales[2],d.sales[1]),d.gth_s,d.lfl_s,true,false,mcSize);
    makeCard('gS',d,d.gp,  ach(d.gp[2],  d.gp[1]),  d.gth_gp,null,false,true,mcSize);
    makeCard('aS',d,d.gpa, ach(d.gpa[2], d.gpa[1]), d.gth_gpa,null,false,false,mcSize);
  });
  const dw=document.getElementById('dash');dw.style.display='flex';
  ['bImg','bPdf','bPpt'].forEach(id=>document.getElementById(id).style.display='inline-block');
  setTimeout(()=>Object.values(CHS).forEach(c=>c.resize()),120);
  updateHeadingColor();
}

function run(){
  const raw=document.getElementById('raw').value;
  const e=document.getElementById('err');e.textContent='';
  if(!raw.trim()){e.textContent='กรุณาวางข้อมูลก่อน';return;}
  const data=parse(raw);
  if(!data){e.textContent='ไม่สามารถอ่านข้อมูลได้';return;}
  lastData=data;renderAll(data);
}

// ---- Export helpers ----
async function getCanvas(){
  Object.values(CHS).forEach(c=>{c.options.animation=false;c.update('none');});
  await new Promise(r=>setTimeout(r,200));
  return await html2canvas(document.getElementById('dash'),{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
}

async function exportImg(){
  const b=document.getElementById('bImg');b.textContent='รอสักครู่...';b.disabled=true;
  try{const cv=await getCanvas();const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='dashboard.png';a.click();}
  finally{b.textContent='⬇ PNG';b.disabled=false;}
}

async function exportPdf(){
  const b=document.getElementById('bPdf');b.textContent='รอสักครู่...';b.disabled=true;
  try{
    const cv=await getCanvas();
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const ih=pw*9/16,yo=(ph-ih)/2;
    pdf.addImage(cv.toDataURL('image/png'),'PNG',0,yo>0?yo:0,pw,ih);
    pdf.save('dashboard.pdf');
  }finally{b.textContent='⬇ PDF';b.disabled=false;}
}

async function exportPpt(){
  const b=document.getElementById('bPpt');b.textContent='รอสักครู่...';b.disabled=true;
  try{
    const cv=await getCanvas();
    const imgData=cv.toDataURL('image/png');
    const pptx=new PptxGenJS();
    pptx.layout='LAYOUT_16x9';
    const slide=pptx.addSlide();
    slide.background={color:'FFFFFF'};
    // เพิ่มรูป dashboard เต็ม slide
    slide.addImage({data:imgData,x:0,y:0,w:'100%',h:'100%'});
    await pptx.writeFile({fileName:'dashboard.pptx'});
  }finally{b.textContent='⬇ PowerPoint';b.disabled=false;}
}

function updateHeadingColor(){
  const h=document.getElementById('dashHeading');
  if(h) h.style.color=tpl().target;
}

const DEMO=[
  {mc:'TOTAL',sales:[83.4,84.9,80.7],gp:[20.6,21.4,21.9],gpa:[17.2,18.1,17.6],gth_s:-3,lfl_s:-5,gth_gp:1.3,gth_gpa:3},
  {mc:'SA',   sales:[27.5,28.6,26.8],gp:[15.4,16.1,16.1],gpa:[4.2,4.6,4.3],  gth_s:-2,lfl_s:-5,gth_gp:0.7,gth_gpa:2},
  {mc:'KC',   sales:[26.3,26.6,24.8],gp:[19.5,20.1,20.6],gpa:[5.1,5.4,5.1],  gth_s:-6,lfl_s:-8,gth_gp:1.1,gth_gpa:0},
  {mc:'HO',   sales:[29.7,29.7,29.1],gp:[26.4,27.5,28.3],gpa:[7.8,8.2,8.2],  gth_s:-2,lfl_s:-5,gth_gp:1.9,gth_gpa:5},
];
function loadDemo(){lastData=DEMO;renderAll(DEMO);}
loadDemo();
</script>
</body>
</html>
